<div class="player-container bg-base-300 rounded-box">
    @if (player()) {
    <div class="flex justify-center md:justify-start">
        <app-character [character]="player()!"></app-character>
    </div>
    } @else {
    <div class="alert alert-warning">
        <span>No player character found. Initialization required.</span>
    </div>
    }
</div>
